<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Heart with Music</title>
    <style>
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .heart-container {
            position: relative;
            width: 500px;
            height: 500px;
        }

        .text {
            position: absolute;
            color: #ff69b4;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
            text-shadow: 0 0 10px #ff69b4;
            animation: floatText 3s infinite ease-in-out;
        }

        @keyframes floatText {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.8; }
            50% { transform: translate(5px, -10px) scale(1.1); opacity: 1; }
        }

        
        #myAudio {
            display: none;
        }
    </style>
</head>
<body>

    <audio id="myAudio" loop>
        <source src="love you love youangel lyrics angel loveyou lyric.mp3" type="audio/mp4">
        Your browser does not support the audio element.
    </audio>

    <div class="heart-container" id="heart"></div>

    <script>
        const heartContainer = document.getElementById('heart');
        const totalTexts = 60;

        for (let i = 0; i < totalTexts; i++) {
            const textElement = document.createElement('div');
            textElement.className = 'text';
            textElement.innerText = 'I love you';

            const t = (i / totalTexts) * 2 * Math.PI;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));

            textElement.style.left = `${x * 15 + 250}px`;
            textElement.style.top = `${y * 15 + 250}px`;
            textElement.style.animationDelay = `${Math.random() * 3}s`;

            heartContainer.appendChild(textElement);
        }

      
        window.onclick = function() {
            const audio = document.getElementById('myAudio');
            audio.play().catch(function(error) {
                console.log("Audio play failed:", error);
            });
        }
    </script>

</body>
</html>
